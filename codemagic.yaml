workflows:
  android-workflow:
    name: Android Build
    max_build_duration: 30
    instance_type: mac_mini_m2

    environment:
      flutter: stable

    scripts:
      - name: Generate Android directory
        script: |
          flutter create . --platforms=android

      - name: Enable Core Library Desugaring
        script: |
          python3 - << 'EOF'
          import os

          kts_file = "android/app/build.gradle.kts"
          gradle_file = "android/app/build.gradle"

          if os.path.exists(kts_file):
              with open(kts_file, "r") as f:
                  lines = f.readlines()

              new_lines = []
              for line in lines:
                  new_lines.append(line)
                  if "compileOptions {" in line:
                      new_lines.append("        isCoreLibraryDesugaringEnabled = true\n")

              content = "".join(new_lines)

              if "dependencies {" in content:
                  content = content.replace(
                      "dependencies {",
                      'dependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")',
                      1
                  )
              else:
                  content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n'

              with open(kts_file, "w") as f:
                  f.write(content)

              print("Fixed build.gradle.kts")

          elif os.path.exists(gradle_file):
              with open(gradle_file, "r") as f:
                  content = f.read()

              content = content.replace(
                  "compileOptions {",
                  "compileOptions {\n        coreLibraryDesugaringEnabled true",
                  1
              )

              content = content.replace(
                  "dependencies {",
                  'dependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"',
                  1
              )

              with open(gradle_file, "w") as f:
                  f.write(content)

              print("Fixed build.gradle")

          else:
              raise Exception("No Android app Gradle file found")

          EOF

      - name: Get dependencies
        script: |
          flutter pub get

      - name: Build Android APK
        script: |
          flutter build apk --release

    artifacts:
      - build/**/outputs/**/*.apk
